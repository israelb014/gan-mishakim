name: Desktop release

# Push a tag like v1.0.0 -> build the Windows installer and attach it to a GitHub Release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install
        run: npm ci

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Build installer (copies the shared web files first)
        run: npm run dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gan-mishakim-setup
          path: desktop/dist/gan-mishakim-setup.exe

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: גן משחקים ${{ github.ref_name }}
          files: desktop/dist/gan-mishakim-setup.exe
          body: |
            **הורדה למחשב:** הורידו את `gan-mishakim-setup.exe` והפעילו אותו. ההתקנה מהירה, למשתמש הנוכחי בלבד, ויוצרת קיצורי דרך "גן משחקים" בשולחן העבודה ובתפריט התחל.
            Windows may show a SmartScreen warning because the installer isn't code-signed: click "More info" → "Run anyway".
