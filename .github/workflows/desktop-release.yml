name: Desktop release

# Push a tag like v1.0.1 -> build the Windows installer and the Linux .deb, attach both to one GitHub Release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install
        run: npm ci

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Build installer (copies the shared web files first)
        run: npm run dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gan-mishakim-setup
          path: desktop/dist/gan-mishakim-setup.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install
        run: npm ci

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Build .deb (copies the shared web files first)
        run: npm run dist:linux

      - name: Check package
        run: |
          dpkg-deb --info dist/gan-mishakim_amd64.deb
          dpkg-deb --contents dist/gan-mishakim_amd64.deb | grep -E 'applications/gan-mishakim.desktop|512x512/apps/gan-mishakim.png|opt/gan-mishakim/gan-mishakim$'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gan-mishakim-deb
          path: desktop/dist/gan-mishakim_amd64.deb
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: גן משחקים ${{ github.ref_name }}
          fail_on_unmatched_files: true
          files: |
            out/gan-mishakim-setup.exe
            out/gan-mishakim_amd64.deb
          body: |
            **הורדה למחשב (Windows):** הורידו את `gan-mishakim-setup.exe` והפעילו אותו. ההתקנה מהירה, למשתמש הנוכחי בלבד, ויוצרת קיצורי דרך "גן משחקים" בשולחן העבודה ובתפריט התחל.
            Windows may show a SmartScreen warning because the installer isn't code-signed: click "More info" → "Run anyway".

            **לינוקס (Linux Mint 22 / Ubuntu 24.04, x64):** הורידו את `gan-mishakim_amd64.deb` והתקינו בלחיצה כפולה, או בטרמינל:
            `sudo apt install ./gan-mishakim_amd64.deb` — ואז "גן משחקים" מופיע בתפריט תחת חינוך / משחקים.
