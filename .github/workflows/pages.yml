name: Pages (website + APT repository)

# Publishes the game website and the signed APT repository (apt/) together.
# Runs on every push to main, and is started by the desktop release workflow after a new release.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Service worker version = commit hash (a new cache on every push)
        run: python3 tools/update_sw.py "${GITHUB_SHA::10}"

      - name: Website files
        run: |
          mkdir -p _site
          cp -r index.html icon.svg manifest.webmanifest sw.js css js fonts audio content _site/
          touch _site/.nojekyll

      - name: Tools for the APT repository
        run: sudo apt-get install -y --no-install-recommends apt-utils

      - name: APT repository (signed)
        env:
          GH_TOKEN: ${{ github.token }}
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: tools/build_apt.sh _site/apt

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
